[mod-setting-description]
hard-nauvis-locomotive-fuel-spend-multiplier=Veduri kütusekulu kordaja. Kõrgemad väärtused panevad vedurid rohkem kütust tarbima.
hard-nauvis-half-mixed-ores=Kõik teised rauast, vasest, söest ja kivist laigud segatakse teiste tüüpidega. Alglaigud on segamata. Maagi suhtarvud on keskmiselt samad, mis vaniljemängul.
hard-nauvis-fully-mixed-ores=Kõik raua-, vase-, söe- ja kivilaigud on omavahel segatud. Maagi suhtarvud on keskmiselt samad, mis vaniljemängul.
hard-nauvis-efficiency-module-effectiveness-multiplier=Väärtus 0,75 tähendab, et tõhususe moodulid on 25% vähem tõhusad.
hard-nauvis-bonus-shotgun-damage-percent=Kohaldatakse haavli- ja lahinghaavlipüsside suhtes.
