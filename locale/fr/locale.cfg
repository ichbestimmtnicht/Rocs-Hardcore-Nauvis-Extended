[mod-setting-description]
hard-nauvis-locomotive-fuel-spend-multiplier=Multiplieur pour la consommation de carburant des locomotives. Des valeurs plus élevées font que les locomotives consomment plus de carburant.
hard-nauvis-half-mixed-ores=Tous les autres morceaux de fer, de cuivre, de charbon et de pierre sont mélangés aux autres types. Les correctifs de départ ne sont pas mélangés. Les rapports de minerai sont les mêmes que le jeu de vanille en moyenne.
hard-nauvis-fully-mixed-ores=Tous les morceaux de fer, de cuivre, de charbon et de pierre sont mélangés. Les rapports de minerai sont les mêmes que le jeu de vanille en moyenne.
hard-nauvis-efficiency-module-effectiveness-multiplier=Une valeur de 0,75 signifie que les modules d'efficacité seront 25% moins efficaces.
hard-nauvis-bonus-shotgun-damage-percent=S'applique aux fusils de chasse et aux fusils de combat.
