[mod-setting-description]
hard-nauvis-locomotive-fuel-spend-multiplier=Multiplikator til motorbrændstofforbrug. Højere værdier gør lokomotiver forbruge mere brændstof.
hard-nauvis-half-mixed-ores=Alle andre jern, kobber, kul og sten patch er blandet med de andre typer. Startplastrene er ublandede. Malmforholdet er det samme som vaniljespillet i gennemsnit.
hard-nauvis-fully-mixed-ores=Alle jern, kobber, kul og sten patches blandes med hinanden. Malmforholdet er det samme som vaniljespillet i gennemsnit.
hard-nauvis-efficiency-module-effectiveness-multiplier=En værdi på 0,75 betyder, at effektivitetsmoduler vil være 25% mindre effektive.
hard-nauvis-bonus-shotgun-damage-percent=Gælder for jagtgeværer og kampgeværer.
