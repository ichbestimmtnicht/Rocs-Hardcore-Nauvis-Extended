[mod-setting-description]
hard-nauvis-locomotive-fuel-spend-multiplier=Mnożnik zużycia paliwa do lokomotyw. Wyższe wartości sprawiają, że lokomotywy zużywają więcej paliwa.
hard-nauvis-half-mixed-ores=Każdy inny kawałek żelaza, miedzi, węgla i kamienia jest wymieszany z innymi typami. Plastry startowe są niezmieszane. Stosunki rudy są takie same jak waniliowe gry średnio.
hard-nauvis-fully-mixed-ores=Wszystkie łaty żelaza, miedzi, węgla i kamienia są ze sobą mieszane. Stosunki rudy są takie same jak waniliowe gry średnio.
hard-nauvis-efficiency-module-effectiveness-multiplier=Wartość 0,75 oznacza, że moduły wydajności będą o 25% mniej skuteczne.
hard-nauvis-bonus-shotgun-damage-percent=Dotyczy strzelb i strzelb bojowych.
