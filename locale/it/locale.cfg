[mod-setting-description]
hard-nauvis-locomotive-fuel-spend-multiplier=Moltiplicatore per il consumo di carburante locomotivo. I valori più elevati rendono le locomotive consumano più carburante.
hard-nauvis-half-mixed-ores=Ogni altro ferro, rame, carbone e pietra è mescolato con gli altri tipi. Le patch di partenza non sono mescolate. I rapporti di minerale sono gli stessi del gioco di vaniglia in media.
hard-nauvis-fully-mixed-ores=Tutte le toppe di ferro, rame, carbone e pietra sono mescolate tra loro. I rapporti di minerale sono gli stessi del gioco di vaniglia in media.
hard-nauvis-efficiency-module-effectiveness-multiplier=Un valore di 0.75 significa che i moduli di efficienza saranno meno efficaci del 25%.
hard-nauvis-bonus-shotgun-damage-percent=Riguarda i fucili e i fucili da combattimento.
