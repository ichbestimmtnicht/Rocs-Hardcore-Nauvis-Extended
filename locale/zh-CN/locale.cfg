[mod-setting-name]
hard-nauvis-locomotive-fuel-spend-multiplier=机车燃料消耗乘数
hard-nauvis-half-mixed-ores=Nauvis上的半混合矿石
hard-nauvis-fully-mixed-ores=Nauvis 上的完全混合矿石
hard-nauvis-efficiency-module-effectiveness-multiplier=效率单元效益乘数
hard-nauvis-bonus-shotgun-damage-percent=猎枪损坏百分比增加
hard-nauvis-landmines-disabled=地雷技术
[mod-setting-description]
hard-nauvis-locomotive-fuel-spend-multiplier=机车燃油消耗乘数. 更高的值使得机车消耗更多的燃料.
hard-nauvis-half-mixed-ores=其他的铁,铜,煤,石补丁均与其他种类混合. 起始补丁未混合. 矿石比例平均与香草游戏相同.
hard-nauvis-fully-mixed-ores=所有铁,铜,煤和石块的补丁相互混合. 矿石比例平均与香草游戏相同.
hard-nauvis-efficiency-module-effectiveness-multiplier=0.75的值意味着效率模块的效果会降低25%.
hard-nauvis-bonus-shotgun-damage-percent=适用于猎枪和作战猎枪.
