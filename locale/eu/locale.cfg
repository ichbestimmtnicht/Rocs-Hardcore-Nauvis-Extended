[mod-setting-description]
hard-nauvis-locomotive-fuel-spend-multiplier=Lokomotorraren erregai-kontsumoaren biderkatzailea. Balio handiek lokomotorrek erregai gehiago kontsumitzen dute.
hard-nauvis-half-mixed-ores=Beste burdin, kobre, ikatz eta harrizko adabaki guztiak beste mota batzuekin nahasten dira. Hasierako adabakiak nahasi gabe daude. Ore-erlazioak banilla-jokoaren berdinak dira batez beste.
hard-nauvis-fully-mixed-ores=Burdina, kobrea, ikatza eta harrizko adabaki guztiak bata bestearekin nahasten dira. Ore-erlazioak banilla-jokoaren berdinak dira batez beste.
hard-nauvis-efficiency-module-effectiveness-multiplier=0,75eko balioak esan nahi du eraginkortasunaren moduluek %25 gutxiago balioko dutela.
hard-nauvis-bonus-shotgun-damage-percent=Pistolak eta eskopetak erabiltzen ditu.
