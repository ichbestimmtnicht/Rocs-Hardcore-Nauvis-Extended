[mod-setting-description]
hard-nauvis-locomotive-fuel-spend-multiplier=Shumë më tepër për konsumin e karburantit me lokomotivë. Vlera më të larta bëjnë që lokomotivat të konsumojnë më shumë karburant.
hard-nauvis-half-mixed-ores=Çdo hekur, bakër, qymyr dhe gur tjetër përzihet me llojet e tjera. Skelat e fillimit janë të pabazuara. Përqindjet e xeherorëve janë njësoj si loja e vaniljes mesatarisht.
hard-nauvis-fully-mixed-ores=I gjithë hekuri, bakri, qymyri dhe guri përzihen me njëri - tjetrin. Përqindjet e xeherorëve janë njësoj si loja e vaniljes mesatarisht.
hard-nauvis-efficiency-module-effectiveness-multiplier=Një vlerë prej 0.75 do të thotë se modulet e efektshmërisë do të jenë 25% më pak efektive.
hard-nauvis-bonus-shotgun-damage-percent=Apele per armet dhe armet luftarake.
