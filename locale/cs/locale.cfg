[mod-setting-description]
hard-nauvis-locomotive-fuel-spend-multiplier=Multiplikátor pro spotřebu lokomotivy. Vyšší hodnoty způsobují, že lokomotivy spotřebovávají více paliva.
hard-nauvis-half-mixed-ores=Každá další železná, měděná, uhelná a kamenná náplast je smíchána s ostatními typy. Počáteční náplasti jsou nesmíšené. Poměry rudy jsou v průměru stejné jako u vanilky.
hard-nauvis-fully-mixed-ores=Všechny železné, měděné, uhelné a kamenné skvrny se smíchají. Poměry rudy jsou v průměru stejné jako u vanilky.
hard-nauvis-efficiency-module-effectiveness-multiplier=Hodnota 0,75 znamená, že moduly účinnosti budou o 25% méně účinné.
hard-nauvis-bonus-shotgun-damage-percent=Platí pro brokovnice a bojové brokovnice.
