[mod-setting-name]
hard-nauvis-locomotive-fuel-spend-multiplier=Множител на разходите за гориво за Locomotive
hard-nauvis-half-mixed-ores=Полусмесени руди на Nauvis
hard-nauvis-fully-mixed-ores=Напълно смесени руди на Nauvis
hard-nauvis-efficiency-module-effectiveness-multiplier=Множител на ефективността на модула за ефективност
