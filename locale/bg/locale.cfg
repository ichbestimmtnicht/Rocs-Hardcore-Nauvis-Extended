[mod-setting-description]
hard-nauvis-locomotive-fuel-spend-multiplier=Мултипликатор за разход на гориво от локомотива. По-високите стойности карат локомотивите да консумират повече гориво.
hard-nauvis-half-mixed-ores=Всеки друг вид желязо, мед, въглища и камък се смесва с другите видове. Стартовите пластири са несмесени. Съотношенията на рудата са същите като ванилията средно.
hard-nauvis-fully-mixed-ores=Всички железни, медни, въглища и каменни петна са смесени помежду си. Съотношенията на рудата са същите като ванилията средно.
hard-nauvis-efficiency-module-effectiveness-multiplier=Стойността на 0.75 означава, че модулите за ефективност ще бъдат с 25% по-малко ефективни.
hard-nauvis-bonus-shotgun-damage-percent=Отнася се за пушки и бойни пушки.
