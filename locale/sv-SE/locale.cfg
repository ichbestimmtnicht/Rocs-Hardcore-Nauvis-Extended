[mod-setting-description]
hard-nauvis-locomotive-fuel-spend-multiplier=Multiplikator för lokomotiv bränsleförbrukning. Högre värden gör att lokomotiv konsumerar mer bränsle.
hard-nauvis-half-mixed-ores=Alla andra järn, koppar, kol och sten patch blandas med andra typer. Startfläckarna är blandade. Ore-kvoterna är desamma som vaniljspelet i genomsnitt.
hard-nauvis-fully-mixed-ores=Alla järn, koppar, kol och stenfläckar blandas med varandra. Ore-kvoterna är desamma som vaniljspelet i genomsnitt.
hard-nauvis-efficiency-module-effectiveness-multiplier=Ett värde på 0,75 innebär att effektivitetsmodulerna blir 25% mindre effektiva.
hard-nauvis-bonus-shotgun-damage-percent=Gäller för hagelgevär och stridspistoler.
