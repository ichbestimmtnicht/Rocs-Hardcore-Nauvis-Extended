[mod-setting-description]
hard-nauvis-locomotive-fuel-spend-multiplier=Multiplicador para consumo de combustible locomotora. Los valores más altos hacen que las locomotoras consuman más combustible.
hard-nauvis-half-mixed-ores=Cada otro parche de hierro, cobre, carbón y piedra se mezcla con los otros tipos. Los parches iniciales no están mezclados. Las relaciones de mineral son las mismas que el juego de vainilla en promedio.
hard-nauvis-fully-mixed-ores=Todos los parches de hierro, cobre, carbón y piedra se mezclan entre sí. Las relaciones de mineral son las mismas que el juego de vainilla en promedio.
hard-nauvis-efficiency-module-effectiveness-multiplier=Un valor de 0.75 significa que los módulos de eficiencia serán 25% menos eficaces.
hard-nauvis-bonus-shotgun-damage-percent=Aplica a escopetas y escopetas de combate.
