[mod-setting-description]
hard-nauvis-locomotive-fuel-spend-multiplier=Daugiklis lokomotyvų degalų sąnaudoms. Dėl didesnių verčių lokomotyvai suvartoja daugiau degalų.
hard-nauvis-half-mixed-ores=Kiekvienas kitas geležies, vario, anglies ir akmens pleistras yra sumaišytas su kitų rūšių. Pradžioje pleistrai nesumaišomi. Rūdos santykis yra toks pat kaip vanilės žaidimas vidutiniškai.
hard-nauvis-fully-mixed-ores=Visi geležies, vario, anglies ir akmens pleistrai yra sumaišyti tarpusavyje. Rūdos santykis yra toks pat kaip vanilės žaidimas vidutiniškai.
hard-nauvis-efficiency-module-effectiveness-multiplier=0,75 vertė reiškia, kad efektyvumo moduliai bus 25% mažiau veiksmingi.
hard-nauvis-bonus-shotgun-damage-percent=Taikoma šautuvams ir kovai su šautuvais.
