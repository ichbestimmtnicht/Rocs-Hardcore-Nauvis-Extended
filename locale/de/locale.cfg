[mod-setting-description]
hard-nauvis-locomotive-fuel-spend-multiplier=Multiplikator für den Kraftstoffverbrauch der Lokomotive. Höhere Werte machen Lokomotiven verbrauchen mehr Kraftstoff.
hard-nauvis-half-mixed-ores=Jeder andere Eisen-, Kupfer-, Kohle- und Steinfleck wird mit den anderen Typen gemischt. Die Startpflaster sind ungemischt. Die Erzverhältnisse sind die gleichen wie das Vanille-Spiel im Durchschnitt.
hard-nauvis-fully-mixed-ores=Alle Eisen-, Kupfer-, Kohle- und Steinfelder werden miteinander gemischt. Die Erzverhältnisse sind die gleichen wie das Vanille-Spiel im Durchschnitt.
hard-nauvis-efficiency-module-effectiveness-multiplier=Ein Wert von 0,75 bedeutet, dass Effizienzmodule 25% weniger effektiv sind.
hard-nauvis-bonus-shotgun-damage-percent=Gilt für Schrotflinten und Kampfflinten.
