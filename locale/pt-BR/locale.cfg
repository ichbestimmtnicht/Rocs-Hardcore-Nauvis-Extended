[mod-setting-description]
hard-nauvis-locomotive-fuel-spend-multiplier=Multiplicador para consumo de combustível. Valores maiores fazem locomotivas consumirem mais combustível.
hard-nauvis-half-mixed-ores=Cada outro ferro, cobre, carvão e pedra é misturado com os outros tipos. Os patches iniciais não são misturados. As proporções de minério são as mesmas do jogo de baunilha em média.
hard-nauvis-fully-mixed-ores=Todo ferro, cobre, carvão e pedras se misturam. As proporções de minério são as mesmas do jogo de baunilha em média.
hard-nauvis-efficiency-module-effectiveness-multiplier=Um valor de 0,75 significa que os módulos de eficiência serão 25% menos eficazes.
hard-nauvis-bonus-shotgun-damage-percent=Aplica-se a espingardas e espingardas de combate.
