[mod-setting-description]
hard-nauvis-locomotive-fuel-spend-multiplier=Locomotive 연료 소비를 위한 Multiplier. 더 높은 가치는 locomotives 더 많은 연료를 소비합니다.
hard-nauvis-half-mixed-ores=다른 철, 구리, 석탄 및 돌 패치는 다른 유형과 혼합됩니다. 시작 패치는 혼합되지 않습니다. ore 비율은 평균에 vanilla 게임과 동일합니다.
hard-nauvis-fully-mixed-ores=모든 철, 구리, 석탄 및 돌 패치는 서로 섞입니다. ore 비율은 평균에 vanilla 게임과 동일합니다.
hard-nauvis-efficiency-module-effectiveness-multiplier=0.75의 가치는 효율성 단위가 25% 더 적은 효과적일 것이라는 점을 의미합니다.
hard-nauvis-bonus-shotgun-damage-percent=샷건 및 전투 샷건에 적용됩니다.
