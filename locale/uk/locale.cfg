[mod-setting-description]
hard-nauvis-locomotive-fuel-spend-multiplier=Мультиплікатор для споживання тепловозного палива. Більшість значень роблять локомотиви споживати більше палива.
hard-nauvis-half-mixed-ores=Кожен інший залізо, мідь, вугільний і кам'яний патч змішують з іншими видами. Відступні патчі незмішуються. Співвідношення руд такі ж, як ванільна гра в середньому.
hard-nauvis-fully-mixed-ores=Всі залізні, мідні, вугільні та кам'яні патчі перемішуються між собою. Співвідношення руд такі ж, як ванільна гра в середньому.
hard-nauvis-efficiency-module-effectiveness-multiplier=Значення 0.75 означає, що модулі ефективності буде 25% менш ефективним.
hard-nauvis-bonus-shotgun-damage-percent=Застосовується для дробовиків і бойових дробовиків.
