[mod-setting-name]
hard-nauvis-locomotive-fuel-spend-multiplier=Зручне паливо витрачає мультиплікатор
hard-nauvis-half-mixed-ores=Половина змішаних руд на Нувіс
hard-nauvis-fully-mixed-ores=Повністю змішаних руд на Нувіс
hard-nauvis-efficiency-module-effectiveness-multiplier=Мультиплікатор ефективності модуля
hard-nauvis-bonus-shotgun-damage-percent=Збільшення відсотка від пошкодження взуття
