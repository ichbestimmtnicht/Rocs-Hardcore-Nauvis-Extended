[mod-setting-description]
hard-nauvis-locomotive-fuel-spend-multiplier=A mozdonyok üzemanyag-fogyasztásának szorzója. A magasabb értékek miatt a mozdonyok több üzemanyagot fogyasztanak.
hard-nauvis-half-mixed-ores=Minden más vas, réz, szén és kő tapaszt összekevernek a többi típussal. A kezdő tapaszok nem keveredtek. Az érc arány ugyanaz, mint a vanília játék átlagosan.
hard-nauvis-fully-mixed-ores=Minden vas-, réz-, szén- és kőfolt egymással keveredik. Az érc arány ugyanaz, mint a vanília játék átlagosan.
hard-nauvis-efficiency-module-effectiveness-multiplier=A 0,75-ös érték azt jelenti, hogy a hatékonysági modulok 25% -kal kevésbé lesznek hatékonyak.
hard-nauvis-bonus-shotgun-damage-percent=A shotgun és a harci shotgun.
