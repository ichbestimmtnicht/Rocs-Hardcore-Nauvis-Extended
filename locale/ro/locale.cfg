[mod-setting-description]
hard-nauvis-locomotive-fuel-spend-multiplier=Multiplicator pentru consumul de combustibil al locomotivei. Valorile mai mari fac locomotivele să consume mai mult combustibil.
hard-nauvis-half-mixed-ores=Orice alt petic de fier, cupru, cărbune şi piatră este amestecat cu celelalte tipuri. Plasturii de început nu sunt amestecaţi. Raportul minereului este acelaşi cu cel al vaniliei în medie.
hard-nauvis-fully-mixed-ores=Toate petele de fier, cupru, cărbune şi piatră sunt amestecate între ele. Raportul minereului este acelaşi cu cel al vaniliei în medie.
hard-nauvis-efficiency-module-effectiveness-multiplier=O valoare de 0,75 înseamnă că modulele de eficiență vor fi cu 25% mai puțin eficiente.
hard-nauvis-bonus-shotgun-damage-percent=Se aplică puştilor şi puştilor de luptă.
