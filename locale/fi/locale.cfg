[mod-setting-description]
hard-nauvis-locomotive-fuel-spend-multiplier=Moottorin polttoaineenkulutuksen kerroin. Suuremmat arvot tekevät veturit kuluttavat enemmän polttoainetta.
hard-nauvis-half-mixed-ores=Kaikki muut rauta-, kupari-, hiili- ja kivilaastarit sekoitetaan muihin tyyppeihin. Aloituslaastarit ovat sekoittamattomia. Malmisuhteet ovat samat kuin vaniljapeli keskimäärin.
hard-nauvis-fully-mixed-ores=Kaikki rautaa, kuparia, hiiltä ja kivilaastareita sekoitetaan keskenään. Malmisuhteet ovat samat kuin vaniljapeli keskimäärin.
hard-nauvis-efficiency-module-effectiveness-multiplier=Arvo 0,75 tarkoittaa, että tehokkuusmoduulit ovat 25 prosenttia tehottomampia.
hard-nauvis-bonus-shotgun-damage-percent=Koskee haulikoita ja taisteluhaulikkoja.
