[mod-setting-description]
hard-nauvis-locomotive-fuel-spend-multiplier=Multiplier עבור צריכת דלק קטר. ערכים גבוהים יותר מייצרים קטרים לצרוך יותר דלק.
hard-nauvis-half-mixed-ores=כל ברזל אחר, נחושת, פחם ואבן מעורב סוגים אחרים. כתמים מתחילים אינם מעורבים. יחסי האור הם אותו משחק וניל בממוצע.
hard-nauvis-fully-mixed-ores=כל ברזל, נחושת, פחם ואבן הם מעורבים אחד עם השני. יחסי האור הם אותו משחק וניל בממוצע.
hard-nauvis-efficiency-module-effectiveness-multiplier=ערך של 0.75 אומר כי מודולי יעילות יהיו 25% פחות יעילים.
hard-nauvis-bonus-shotgun-damage-percent=מומלץ לירות בתותחים ולהילחם בתותחים.
