[mod-setting-name]
hard-nauvis-locomotive-fuel-spend-multiplier=การใช้เชื้อเพลิงโลโคโมทีฟ
hard-nauvis-half-mixed-ores=แร่ครึ่งเล็กครึ่งบนนูวิส
hard-nauvis-fully-mixed-ores=แร่ผสมอย่างสมบูรณ์บนนูวิส
hard-nauvis-efficiency-module-effectiveness-multiplier=ตัวเพิ่มประสิทธิภาพในโมดูลอย่างเพียงพอ
hard-nauvis-bonus-shotgun-damage-percent=ความเสียหายของปืนลูกซองเพิ่มขึ้น
hard-nauvis-landmines-disabled=ปิดการใช้งานเทคโนโลยีของระเบิด
[mod-setting-description]
hard-nauvis-locomotive-fuel-spend-multiplier=มีประสิทธิภาพในการบริโภคเชื้อเพลิง ค่าที่สูงกว่าทําให้รถจักรกลใช้เชื้อเพลิงมากขึ้น.
hard-nauvis-half-mixed-ores=เหล็ก, ทองแดง, ถ่าน หิน และ หิน อื่น ๆ ทุก ชนิด ถูก ผสม เข้า ด้วย กัน. ชิ้นส่วนเริ่มไม่พอดี อัตราส่วนแร่เท่ากับ เกมวานิลลาโดยเฉลี่ย.
hard-nauvis-fully-mixed-ores=เหล็ก ทองแดง ถ่านหิน และเศษหินทั้งหมด ถูกผสมเข้าด้วยกัน อัตราส่วนแร่เท่ากับ เกมวานิลลาโดยเฉลี่ย.
hard-nauvis-efficiency-module-effectiveness-multiplier=มูลค่า 0.75 หมายความว่าโมดูลที่มีประสิทธิภาพจะมีประสิทธิภาพลดลง 25%.
hard-nauvis-bonus-shotgun-damage-percent=เตรียมปืนลูกซองและปืนลูกซอง.
