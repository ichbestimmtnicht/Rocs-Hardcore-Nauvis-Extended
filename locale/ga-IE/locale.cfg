[mod-setting-description]
hard-nauvis-locomotive-fuel-spend-multiplier=Iolraitheoir le haghaidh tomhaltas breosla innill ghluaiste. Déanann luachanna níos airde níos mó breosla a ithe.
hard-nauvis-half-mixed-ores=Tá gach iarann, copar, gual agus paiste cloiche measctha leis na cineálacha eile. Tá na paistí ag tosú unmixed. Is iad na cóimheasa ore mar an gcéanna leis an cluiche vanilla ar an meán.
hard-nauvis-fully-mixed-ores=Tá gach paistí iarainn, copar, guail agus cloiche measctha lena chéile. Is iad na cóimheasa ore mar an gcéanna leis an cluiche vanilla ar an meán.
hard-nauvis-efficiency-module-effectiveness-multiplier=Ciallaíonn luach 0.75 go mbeidh modúil éifeachtúlachta 25% níos lú éifeachtach.
hard-nauvis-bonus-shotgun-damage-percent=A bhaineann le gunnaí gráin agus gunnaí a chomhrac.
