[mod-setting-description]
hard-nauvis-locomotive-fuel-spend-multiplier=Vermenigvuldiger voor het brandstofverbruik van locomotieven. Hogere waarden maken dat locomotieven meer brandstof verbruiken.
hard-nauvis-half-mixed-ores=Elk ander ijzer, koper, steenkool en steen wordt gemengd met de andere soorten. De startpleisters zijn niet gemengd. De ertsverhoudingen zijn hetzelfde als het vanillespel gemiddeld.
hard-nauvis-fully-mixed-ores=Alle ijzer, koper, kolen en stenen vlekken worden met elkaar gemengd. De ertsverhoudingen zijn hetzelfde als het vanillespel gemiddeld.
hard-nauvis-efficiency-module-effectiveness-multiplier=Een waarde van 0,75 betekent dat efficiëntiemodules 25% minder effectief zullen zijn.
hard-nauvis-bonus-shotgun-damage-percent=Geldt voor jachtgeweren en gevechtsgeweren.
