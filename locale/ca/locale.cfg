[mod-setting-description]
hard-nauvis-locomotive-fuel-spend-multiplier=Multiplicant per al consum de combustible locomotora. Els valors més alts fan que la locomotora consumeixin més combustible.
hard-nauvis-half-mixed-ores=Cada altre ferro, coure, carbó i pegat de pedra es mescla amb els altres tipus. Els pedaços que comencen no s' ordenen. Les relacions ore són iguals que el joc de vanilla en mitjana.
hard-nauvis-fully-mixed-ores=Tots els ferros, coure, carbó i pegats de pedra es barregen entre ells. Les relacions ore són iguals que el joc de vanilla en mitjana.
hard-nauvis-efficiency-module-effectiveness-multiplier=Un valor de 0,5 vol dir que els mòduls d'eficiència seran menys efectius.
hard-nauvis-bonus-shotgun-damage-percent=Apel·lacions a trets i armes de combat.
