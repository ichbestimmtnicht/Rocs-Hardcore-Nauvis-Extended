[mod-setting-name]
hard-nauvis-locomotive-fuel-spend-multiplier=سوخت Locomotive چند برابر هزینه می کند
hard-nauvis-half-mixed-ores=نیمه مخلوط در Nauvis
hard-nauvis-fully-mixed-ores=ترکیب کامل در Nauvis
hard-nauvis-efficiency-module-effectiveness-multiplier=بهره وری ماژول اثربخشی Multiplier
hard-nauvis-bonus-shotgun-damage-percent=افزایش آسیب های شلیک شده
hard-nauvis-landmines-disabled=تکنولوژی Landmine معلول
[mod-setting-description]
hard-nauvis-locomotive-fuel-spend-multiplier=چند برابر برای مصرف سوخت لوکوموتیو ارزش های بالاتر باعث می شود که لوکوموتیو ها سوخت بیشتری مصرف کنند.
hard-nauvis-half-mixed-ores=هر نوع آهن، مس، زغال سنگ و سنگ با انواع دیگر مخلوط می شود. پچ های شروع مخلوط نشده اند. نسبت های Ore شبیه به بازی وانیل به طور متوسط است.
hard-nauvis-fully-mixed-ores=تمام آهن، مس، زغال سنگ و تکه های سنگی با یکدیگر مخلوط می شوند. نسبت های Ore شبیه به بازی وانیل به طور متوسط است.
hard-nauvis-efficiency-module-effectiveness-multiplier=ارزش 75 به این معنی است که ماژول های بهره وری 25٪ کمتر موثر خواهد بود.
hard-nauvis-bonus-shotgun-damage-percent=ضرب گلوله و گلوله های جنگی.
