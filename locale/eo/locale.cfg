[mod-setting-description]
hard-nauvis-locomotive-fuel-spend-multiplier=Multiplier por lokomotivfuela konsumo. Pli altaj valoroj produktas lokomotivojn konsumas pli da fuelo.
hard-nauvis-half-mixed-ores=Ĉiu alia fero, kupro, karbo kaj ŝtonpeceto estas miksita kun la aliaj tipoj. La startpecetoj estas nemiksitaj. La ercoproporcioj estas la sama kiel la vanilo ludo averaĝe.
hard-nauvis-fully-mixed-ores=Ĉiu fero, kupro, karbo kaj ŝtonpecetoj estas miksitaj kun unu la alian. La ercoproporcioj estas la sama kiel la vanilo ludo averaĝe.
hard-nauvis-efficiency-module-effectiveness-multiplier=Valoro de 0.75 signifas ke efikecmoduloj estos 25% malpli efikaj.
hard-nauvis-bonus-shotgun-damage-percent=Kandidatoj al ĉaspafiloj kaj batalĉaspafiloj.
