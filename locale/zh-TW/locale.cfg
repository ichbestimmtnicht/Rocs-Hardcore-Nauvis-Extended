[mod-setting-description]
hard-nauvis-locomotive-fuel-spend-multiplier=机车燃油消耗乘以乘. 更高的價值使得机車消耗更多的燃料.
hard-nauvis-half-mixed-ores=其他的鐵,銅,煤和石板 都和其他類型混在一起. 起始补丁未混合 。 矿石比率平均与香草遊戲相同.
hard-nauvis-fully-mixed-ores=所有鐵,銅,煤和石板都互相混合. 矿石比率平均与香草遊戲相同.
hard-nauvis-efficiency-module-effectiveness-multiplier=0. 75 的值表示效率模組的效果會降低25%.
hard-nauvis-bonus-shotgun-damage-percent=适用于獵槍和戰鬥獵槍.
