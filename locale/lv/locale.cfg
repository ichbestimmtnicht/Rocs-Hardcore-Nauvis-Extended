[mod-setting-description]
hard-nauvis-locomotive-fuel-spend-multiplier=Reizinātājs lokomotīvju degvielas patēriņam. Augstākas vērtības liek lokomotīvēm patērēt vairāk degvielas.
hard-nauvis-half-mixed-ores=Visi citi dzelzs, vara, ogļu un akmens plāksteri ir sajaukti ar citiem veidiem. Sākuma plāksteri ir nesajaukti. Rūdu attiecības ir tādas pašas kā vidēji spēlē vaniļas.
hard-nauvis-fully-mixed-ores=Visi dzelzs, vara, ogļu un akmens plankumi ir sajaukti savā starpā. Rūdu attiecības ir tādas pašas kā vidēji spēlē vaniļas.
hard-nauvis-efficiency-module-effectiveness-multiplier=Vērtība 0,75 nozīmē, ka efektivitātes moduļi būs par 25% mazāk efektīvi.
hard-nauvis-bonus-shotgun-damage-percent=Attiecas uz bisēm un kaujas bisēm.
