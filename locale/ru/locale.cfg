[mod-setting-description]
hard-nauvis-locomotive-fuel-spend-multiplier=Умножитель расхода локомотивного топлива. Более высокие значения заставляют локомотивы потреблять больше топлива.
hard-nauvis-half-mixed-ores=Все другие виды железа, меди, угля и камня смешиваются с другими типами. Стартовые патчи не смешанные. Соотношение руд в среднем такое же, как и ванильная игра.
hard-nauvis-fully-mixed-ores=Все железные, медные, угольные и каменные пластыри смешиваются друг с другом. Соотношение руд в среднем такое же, как и ванильная игра.
hard-nauvis-efficiency-module-effectiveness-multiplier=Значение 0,75 означает, что модули эффективности будут на 25% менее эффективными.
hard-nauvis-bonus-shotgun-damage-percent=Применяется для дробовиков и боевых дробовиков.
