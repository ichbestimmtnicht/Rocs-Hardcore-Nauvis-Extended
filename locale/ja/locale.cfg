[mod-setting-name]
hard-nauvis-locomotive-fuel-spend-multiplier=ロコティブ燃料費マルチプライヤー
hard-nauvis-half-mixed-ores=ノービスの半分の混合された鉱石
hard-nauvis-fully-mixed-ores=ノービスの完全に混合された鉱石
hard-nauvis-efficiency-module-effectiveness-multiplier=効率モジュールの有効性のmultiplier
hard-nauvis-bonus-shotgun-damage-percent=ショットガンダメージパーセンテージ増加
hard-nauvis-landmines-disabled=ランドミン技術 無効化
[mod-setting-description]
hard-nauvis-locomotive-fuel-spend-multiplier=機関車の燃料消費量のための多層。 より高い値は、機関車がより多くの燃料を消費するようになります.
hard-nauvis-half-mixed-ores=他の鉄、銅、石炭、石のパッチは他のタイプと混合されます。 開始パッチは混入しません。 鉱石比率は平均的にバニラゲームと同じです.
hard-nauvis-fully-mixed-ores=すべての鉄、銅、石炭、石のパッチは互いに混合されます。 鉱石比率は平均的にバニラゲームと同じです.
hard-nauvis-efficiency-module-effectiveness-multiplier=0.75 の値は、効率モジュールが 25% 以下に有効であることを意味します.
hard-nauvis-bonus-shotgun-damage-percent=ショットガンと戦闘ショットガンに適用されます.
