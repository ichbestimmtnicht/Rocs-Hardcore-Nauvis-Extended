[mod-setting-description]
hard-nauvis-locomotive-fuel-spend-multiplier=Lokomotif yakıt tüketimi için çok basit. Yüksek değerler lokomotifler daha fazla yakıt tüketiyor.
hard-nauvis-half-mixed-ores=Diğer her demir, bakır, kömür ve taş yama diğer tiplerle karıştırılır. Başlangıç yamaları karıştırılıyor. Ore oranları ortalama olarak vanilya oyunu ile aynıdır.
hard-nauvis-fully-mixed-ores=Tüm demir, bakır, kömür ve taş yamalar birbirleriyle karıştırılır. Ore oranları ortalama olarak vanilya oyunu ile aynıdır.
hard-nauvis-efficiency-module-effectiveness-multiplier=0.75 değeri, verimlilik modüllerinin %25 daha az etkili olacağı anlamına gelir.
hard-nauvis-bonus-shotgun-damage-percent=Silahsızlara ve savaş tüfeğine uygun.
