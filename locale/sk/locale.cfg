[mod-setting-description]
hard-nauvis-locomotive-fuel-spend-multiplier=Násobič pre spotrebu paliva lokomotívy. Vyššie hodnoty spôsobujú, že lokomotívy spotrebujú viac paliva.
hard-nauvis-half-mixed-ores=Každá ďalšia železná, medená, uhoľná a kamenná náplasť sa mieša s ostatnými typmi. Počiatočné náplasti sú nezmiešané. Pomery rudy sú v priemere rovnaké ako v vanilkovej hre.
hard-nauvis-fully-mixed-ores=Všetky železné, medené, uhoľné a kamenné škvrny sú navzájom zmiešané. Pomery rudy sú v priemere rovnaké ako v vanilkovej hre.
hard-nauvis-efficiency-module-effectiveness-multiplier=Hodnota 0,75 znamená, že moduly účinnosti budú o 25% menej účinné.
hard-nauvis-bonus-shotgun-damage-percent=Platí pre brokovnice a bojové brokovnice.
