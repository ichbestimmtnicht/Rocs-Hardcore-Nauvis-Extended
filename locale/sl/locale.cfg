[mod-setting-description]
hard-nauvis-locomotive-fuel-spend-multiplier=Množitelj za porabo goriva lokomotiv. Zaradi višjih vrednosti lokomotive porabijo več goriva.
hard-nauvis-half-mixed-ores=Vse druge železne, bakrene, ogljene in kamnite obliže mešajo z drugimi vrstami. Začetni obliži niso zmešani. Razmerje rude je povprečno enako vanilijevi igri.
hard-nauvis-fully-mixed-ores=Vse železne, bakrene, ogljene in kamnite zaplate se pomešajo med seboj. Razmerje rude je povprečno enako vanilijevi igri.
hard-nauvis-efficiency-module-effectiveness-multiplier=Vrednost 0,75 pomeni, da bodo moduli učinkovitosti 25 % manj učinkoviti.
hard-nauvis-bonus-shotgun-damage-percent=Uporablja se za puške in bojne puške.
