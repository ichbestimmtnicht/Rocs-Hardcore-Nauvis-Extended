[mod-setting-description]
hard-nauvis-locomotive-fuel-spend-multiplier=مضاعف لاستهلاك الوقود القاطر. القيم العليا تجعل القاطرات تستهلك المزيد من الوقود.
hard-nauvis-half-mixed-ores=كل الحديد والنحاس والفحم والصخور الأخرى مختلط مع الأنواع الأخرى البقايا البدائية غير ثابتة نسب الركاز هي نفس نسبة لعبة الفانيلا في المتوسط.
hard-nauvis-fully-mixed-ores=كُلّ الحديد، النحاس، الفحم والصخور يَختلطُ مَع بعضهم البعض. نسب الركاز هي نفس نسبة لعبة الفانيلا في المتوسط.
hard-nauvis-efficiency-module-effectiveness-multiplier=وقيمة 0.75 تعني أن وحدات الكفاءة ستكون أقل فعالية بنسبة 25 في المائة.
hard-nauvis-bonus-shotgun-damage-percent=يُطبق على البنادق و البنادق القتالية.
