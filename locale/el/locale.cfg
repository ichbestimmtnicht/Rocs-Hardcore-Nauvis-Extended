[mod-setting-description]
hard-nauvis-locomotive-fuel-spend-multiplier=Πολλαπλασιαστής για την κατανάλωση καυσίμων μηχανών. Οι υψηλότερες τιμές κάνουν τις μηχανές να καταναλώνουν περισσότερα καύσιμα.
hard-nauvis-half-mixed-ores=Κάθε άλλο κομμάτι σιδήρου, χαλκού, άνθρακα και πέτρας αναμειγνύεται με τους άλλους τύπους. Τα έμπλαστρα εκκίνησης δεν έχουν αναμειχθεί. Οι αναλογίες μεταλλεύματος είναι ίδιες με το παιχνίδι βανίλιας κατά μέσο όρο.
hard-nauvis-fully-mixed-ores=Όλα τα κομμάτια σιδήρου, χαλκού, άνθρακα και πέτρας αναμειγνύονται μεταξύ τους. Οι αναλογίες μεταλλεύματος είναι ίδιες με το παιχνίδι βανίλιας κατά μέσο όρο.
hard-nauvis-efficiency-module-effectiveness-multiplier=Μια τιμή 0,75 σημαίνει ότι οι μονάδες απόδοσης θα είναι 25% λιγότερο αποτελεσματικές.
hard-nauvis-bonus-shotgun-damage-percent=Ισχύει για καραμπίνες και πολεμικές καραμπίνες.
