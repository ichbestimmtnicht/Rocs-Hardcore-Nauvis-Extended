[mod-setting-description]
hard-nauvis-locomotive-fuel-spend-multiplier=Multiplier untuk konsumsi bahan bakar lokomotif. Nilai yang lebih tinggi membuat lokomotif mengkonsumsi lebih banyak bahan bakar.
hard-nauvis-half-mixed-ores=Setiap besi, tembaga, batu bara dan patch batu lain dicampur dengan jenis lain. Tambalan awal tidak bercampur. Rasio bijih rata-rata sama dengan permainan vanili.
hard-nauvis-fully-mixed-ores=Semua besi, tembaga, batu bara dan patch batu bercampur satu sama lain. Rasio bijih rata-rata sama dengan permainan vanili.
hard-nauvis-efficiency-module-effectiveness-multiplier=Nilai 0.75 berarti bahwa modul efisiensi akan kurang 25% efektif.
hard-nauvis-bonus-shotgun-damage-percent=Aplikasi untuk senapan dan tempur senapan.
